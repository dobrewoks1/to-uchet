<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт ТО</title>
  <link rel="icon" type="image/svg+xml" href="icons/gauge.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div id="app"><p class="boot-wait" id="boot-wait">Загрузка…</p></div>
  <noscript><p class="boot-wait">Программе нужен JavaScript. Включите его в настройках браузера.</p></noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    // Если основной модуль не загрузился (повреждён файл программы), человек не должен смотреть на вечную «Загрузку…».
    setTimeout(function () {
      var wait = document.getElementById('boot-wait');
      if (wait) wait.textContent = 'Программа не загрузилась. Закройте это окно и запустите её заново.';
    }, 8000);
  </script>
</body>
</html>
